$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://almudaya.local/schemas/formal-proof-certificate.schema.yaml"
title: "AMCA Multi-Stage Formal Proof Certificate"
type: object
additionalProperties: false
required:
  - certificate_version
  - machine_id
  - specification_sha256
  - candidate_sha256
  - certificate_sha256
  - overall_status
  - stage1_spec_proof
  - stage2_evolution_proof
  - stage3_refinement_proof
  - obligations
  - counterexamples
  - generated_at
properties:
  certificate_version:
    const: "1.0"
  machine_id:
    type: string
  specification_sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  candidate_sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  certificate_sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  overall_status:
    type: string
    enum: [PROVED, REFUTED]
  stage1_spec_proof:
    type: object
    required: [status, checks_passed, checks_total]
  stage2_evolution_proof:
    type: object
    required: [status]
  stage3_refinement_proof:
    type: object
    required: [status]
  obligations:
    type: array
    items:
      type: object
      required: [id, stage, title, status, formula, details]
      properties:
        id:
          type: string
          enum:
            - FO-TOP-01
            - FO-CON-01
            - FO-HOA-01
            - FO-GOAL-01
            - FO-SEC-01
            - FO-EVO-01
            - FO-REF-01
            - FO-REF-02
        stage:
          type: integer
          enum: [1, 2, 3]
        title:
          type: string
        status:
          type: string
          enum: [PROVED, REFUTED, NOT_RUN]
        formula:
          type: string
        details:
          type: object
  counterexamples:
    type: array
    items:
      type: object
      required: [obligation_id, message, witness]
  generated_at:
    type: string
